<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.ico">
<title>Nova — Changelog</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/versions-api.js"></script>
<script src="assets/markdown.js"></script>
</head>
<body>
<main>
  <nav class="site-nav">
    <a href="index.html">Accueil</a>
    <a href="versions.html">Versions</a>
    <a href="changelog.html" aria-current="page">Changelog</a>
  </nav>

  <h1>Changelog</h1>
  <p class="tagline">Historique des changements, tel que suivi sur la branche release.</p>

  <div id="changelog-content" class="changelog-content" hidden></div>
  <p id="changelog-status" class="status-message">Chargement du changelog…</p>
</main>

<script>
(function() {
  const REPO = NOVA_REPO;
  const contentEl = document.getElementById('changelog-content');
  const statusEl = document.getElementById('changelog-status');

  const url = 'https://raw.githubusercontent.com/' + REPO + '/release/CHANGELOG.md';

  fetch(url)
    .then(function(res) {
      if (!res.ok) throw new Error('GitHub error: ' + res.status);
      return res.text();
    })
    .then(function(text) {
      if (!text.trim()) {
        statusEl.textContent = 'Le fichier CHANGELOG.md existe mais est vide.';
        return;
      }
      contentEl.innerHTML = novaRenderMarkdown(text);
      contentEl.hidden = false;
      statusEl.remove();
    })
    .catch(function(err) {
      statusEl.textContent = 'Impossible de charger le changelog depuis GitHub (' + err.message + ').';
    });
})();
</script>
</body>
</html>
